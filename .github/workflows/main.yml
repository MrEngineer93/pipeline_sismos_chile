name: Automatizacion del ETL de Sismos

on:
  schedule:
    - cron: '0 6 * * *' # Se ejecuta automáticamente todos los días a las 06:00 UTC
  workflow_dispatch:   # Permite activarlo manualmente desde la web de GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código del repositorio al servidor virtual
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Python limpio
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalar las librerías necesarias
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Ejecutar el pipeline ETL (Genera sismos_analitico.db y etl_execution.log)
    - name: Ejecutar Pipeline ETL
      run: python src/etl.py

    # 5. Guardar la base de datos y el archivo de log en el repositorio
    - name: Guardar cambios y logs en el repositorio
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git add data/processed/sismos_analitico.db data/processed/etl_execution.log
        git commit -m "Actualizar base de datos y logs"
        git push origin main
